<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DEMO - Premium Budget Planner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: 'var(--color-bg)',
                            card: 'var(--color-card)',
                            sidebar: 'var(--color-sidebar)',
                            text: 'var(--color-text)',
                            muted: 'var(--color-muted)',
                            primary: 'var(--color-primary)',
                            primaryHover: 'var(--color-primary-hover)',
                            danger: '#E07A5F',
                            sage: '#86A789'
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
                    },
                    boxShadow: {
                        'soft': '0 10px 40px -10px rgba(0,0,0,0.08)',
                        'inner-soft': 'inset 0 2px 4px 0 rgba(0, 0, 0, 0.02)'
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Base Themes */
        :root {
            --color-bg: #FDFBF7;
            --color-card: #FFFFFF;
            --color-sidebar: #FCF9F2;
            --color-text: #2D2B2A;
            --color-muted: #87837E;
            
            /* Default Pink Theme */
            --color-primary: #E09891;
            --color-primary-hover: #D4827B;
        }

        .dark {
            --color-bg: #181716;
            --color-card: #22201F;
            --color-sidebar: #1E1D1C;
            --color-text: #EFECE6;
            --color-muted: #A09C96;
        }

        /* Dynamic Themes */
        .theme-sage { --color-primary: #86A789; --color-primary-hover: #739076; }
        .theme-slate { --color-primary: #64748B; --color-primary-hover: #475569; }
        .theme-lavender { --color-primary: #9F86C0; --color-primary-hover: #8A6EAB; }

        /* UI Smoothness */
        body { 
            -webkit-font-smoothing: antialiased; 
            -moz-osx-font-smoothing: grayscale; 
            background-color: var(--color-bg);
            color: var(--color-text);
            transition: background-color 0.3s, color 0.3s;
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: var(--color-muted); border-radius: 10px; opacity: 0.5;}
        
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .progress-bar { transition: width 1s cubic-bezier(0.16, 1, 0.3, 1); }
        .backdrop-blur-md { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.5);
            cursor: pointer;
        }
    </style>
</head>
<body class="overflow-hidden h-screen w-screen">
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- SVGs ---
        const Icons = {
            Plus: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            Check: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
            Home: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
            Today: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            Calendar: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,
            Goals: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>,
            Savings: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 14.99a8.03 8.03 0 0 1-14 0"/><path d="M12 2v8"/><path d="m8 6 4-4 4 4"/><circle cx="12" cy="18" r="2"/></svg>,
            Debt: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>,
            Envelopes: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>,
            Settings: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
            X: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            Trash: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
            Sun: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>,
            Moon: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        };

        // --- LocalStorage Hook ---
        function useLocalStorage(key, initialValue) {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) { return initialValue; }
            });
            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) { console.error(error); }
            };
            return [storedValue, setValue];
        }

        // --- Default Data Sets ---
        const DEFAULT_ENVELOPES = [
            { id: '1', name: 'Rent / Mortgage', budget: 1500 },
            { id: '2', name: 'Groceries', budget: 600 },
            { id: '3', name: 'Dining Out', budget: 200 },
            { id: '4', name: 'Fuel / Transit', budget: 150 },
            { id: '5', name: 'Utilities', budget: 250 },
            { id: '6', name: 'Internet / Phone', budget: 120 },
            { id: '7', name: 'Subscriptions', budget: 50 },
            { id: '8', name: 'Health / Medical', budget: 100 },
            { id: '9', name: 'Personal Care', budget: 100 },
            { id: '10', name: 'Pets', budget: 80 },
            { id: '11', name: 'Clothing', budget: 100 },
            { id: '12', name: 'Entertainment', budget: 150 },
            { id: '13', name: 'Household Items', budget: 100 },
            { id: '14', name: 'Education', budget: 0 },
            { id: '15', name: 'Gifts / Donations', budget: 50 }
        ];

        // --- Main App Component ---
        function App() {
            const [view, setView] = useState('home');
            const [isModalOpen, setIsModalOpen] = useState(false);
            
            // App Settings
            const [settings, setSettings] = useLocalStorage('pb_settings', {
                darkMode: false,
                themeColor: 'pink',
                currencySymbol: '$',
                userName: 'User'
            });

            // Financial Data (Single Source of Truth)
            const [transactions, setTransactions] = useLocalStorage('pb_transactions', []);
            const [envelopes, setEnvelopes] = useLocalStorage('pb_envelopes', DEFAULT_ENVELOPES);
            const [savings, setSavings] = useLocalStorage('pb_savings', [{ id: 's1', name: 'Emergency Fund', target: 10000 }]);
            const [debts, setDebts] = useLocalStorage('pb_debts', [{ id: 'd1', name: 'Credit Card', target: 5000 }]);
            const [goals, setGoals] = useLocalStorage('pb_goals', [{ id: 'g1', name: 'New Laptop', target: 1500 }]);
            const [bills, setBills] = useLocalStorage('pb_bills', [{ id: 'b1', name: 'Electricity', amount: 120, date: '15', paid: false }]);

            // --- Theme Application ---
            useEffect(() => {
                if (settings.darkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
                
                document.body.className = `theme-${settings.themeColor}`;
            }, [settings.darkMode, settings.themeColor]);

            // --- Formatting ---
            const formatMoney = (amount) => {
                return `${settings.currencySymbol}${parseFloat(amount).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            };

            // --- Core Calculations Engine ---
            const calculations = useMemo(() => {
                let totalIncome = 0;
                let totalExpense = 0; // Includes regular expenses, savings deposits, and debt payments

                transactions.forEach(t => {
                    if (t.type === 'income') {
                        totalIncome += parseFloat(t.amount);
                    } else {
                        // Expense, Savings, Debt all reduce the "Safe to Spend" checking account balance
                        totalExpense += parseFloat(t.amount);
                    }
                });

                return {
                    totalIncome,
                    totalExpense,
                    safeToSpend: totalIncome - totalExpense
                };
            }, [transactions]);

            // --- Transaction Handlers ---
            const handleAddTransaction = (t) => {
                setTransactions([{ ...t, id: Date.now().toString() }, ...transactions]);
                setIsModalOpen(false);
            };

            const handleDeleteTransaction = (id) => {
                setTransactions(transactions.filter(t => t.id !== id));
            };

            return (
                <div className="flex flex-col h-full w-full">
                    {/* DEMO BANNER */}
                    <div className="bg-[#E07A5F] text-white text-center p-2 font-bold text-sm z-50 w-full shadow-md flex-shrink-0">
                        ⚠️ DEMO MODE: Data will not be saved permanently. Purchase the full version on Etsy for private browser access and secure data export.
                    </div>
                    
                    <div className="flex flex-1 w-full overflow-hidden">
                        {/* Sidebar Nav */}
                        <nav className="w-20 md:w-64 flex-shrink-0 bg-brand-sidebar h-full border-r border-black/5 dark:border-white/5 flex flex-col justify-between py-6 transition-colors shadow-[2px_0_15px_rgba(0,0,0,0.02)] z-10">
                            <div className="px-4 md:px-6 overflow-y-auto">
                                <div className="hidden md:block mb-8 pl-2">
                                    <div className="w-8 h-8 bg-brand-primary rounded-xl mb-3 flex items-center justify-center text-white font-bold">P</div>
                                    <h1 className="text-xl font-bold tracking-tight">Clarity Budget</h1>
                                    <p className="text-xs font-medium text-brand-muted mt-1">{settings.userName}'s planner</p>
                                </div>
                                
                                <button 
                                    onClick={() => setIsModalOpen(true)}
                                    className="w-full bg-brand-primary hover:bg-brand-primaryHover text-white md:py-3 md:px-4 p-3 rounded-2xl md:rounded-xl shadow-soft font-semibold flex items-center justify-center gap-2 transition transform hover:scale-[1.02] mb-8"
                                >
                                    <Icons.Plus /> <span className="hidden md:inline">Track spending</span>
                                </button>

                                <div className="space-y-1">
                                    <NavItem icon={<Icons.Home />} label="Home" viewName="home" currentView={view} setView={setView} />
                                    <NavItem icon={<Icons.Today />} label="Today" viewName="today" currentView={view} setView={setView} />
                                    <NavItem icon={<Icons.Calendar />} label="Calendar" viewName="calendar" currentView={view} setView={setView} />
                                    
                                    <div className="my-4 border-t border-black/5 dark:border-white/5 mx-2"></div>
                                    
                                    <NavItem icon={<Icons.Envelopes />} label="Envelopes" viewName="envelopes" currentView={view} setView={setView} />
                                    <NavItem icon={<Icons.Savings />} label="Savings" viewName="savings" currentView={view} setView={setView} />
                                    <NavItem icon={<Icons.Goals />} label="Goals" viewName="goals" currentView={view} setView={setView} />
                                    <NavItem icon={<Icons.Debt />} label="Debt" viewName="debt" currentView={view} setView={setView} />
                                </div>
                            </div>
                            <div className="px-4 md:px-6 pt-4 border-t border-black/5 dark:border-white/5 mt-4">
                                <NavItem icon={<Icons.Settings />} label="Settings" viewName="settings" currentView={view} setView={setView} />
                            </div>
                        </nav>

                        {/* Main Workspace */}
                        <main className="flex-1 h-full overflow-y-auto relative bg-brand-bg transition-colors">
                            <div className="max-w-5xl mx-auto p-6 md:p-12 pb-32">
                                {view === 'home' && <HomeView calc={calculations} formatMoney={formatMoney} bills={bills} categories={envelopes} transactions={transactions} onDeleteTx={handleDeleteTransaction} />}
                                {view === 'today' && <TodayView transactions={transactions} safe={calculations.safeToSpend} formatMoney={formatMoney} onDeleteTx={handleDeleteTransaction} />}
                                {view === 'calendar' && <CalendarView bills={bills} setBills={setBills} formatMoney={formatMoney} transactions={transactions} />}
                                {view === 'envelopes' && <EnvelopesView envelopes={envelopes} setEnvelopes={setEnvelopes} transactions={transactions} formatMoney={formatMoney} />}
                                {view === 'savings' && <ProgressView title="Savings Funds" type="savings" data={savings} setData={setSavings} transactions={transactions} formatMoney={formatMoney} color="bg-brand-sage" />}
                                {view === 'goals' && <ProgressView title="Goals" type="goal" data={goals} setData={setGoals} transactions={transactions} formatMoney={formatMoney} color="bg-brand-primary" />}
                                {view === 'debt' && <ProgressView title="Debt Payoff" type="debt" data={debts} setData={setDebts} transactions={transactions} formatMoney={formatMoney} color="bg-[#E07A5F]" />}
                                {view === 'settings' && <SettingsView settings={settings} setSettings={setSettings} />}
                            </div>
                        </main>

                        {/* Global Transaction Modal */}
                        {isModalOpen && (
                            <TrackModal 
                                onClose={() => setIsModalOpen(false)} 
                                onSave={handleAddTransaction}
                                envelopes={envelopes}
                                savings={savings}
                                goals={goals}
                                debts={debts}
                            />
                        )}
                    </div>
                </div>
            );
        }

        // --- Shared UI Components ---
        function NavItem({ icon, label, viewName, currentView, setView }) {
            const active = currentView === viewName;
            return (
                <button 
                    onClick={() => setView(viewName)}
                    className={`w-full flex items-center justify-center md:justify-start gap-3 p-3 md:px-4 md:py-2.5 rounded-xl transition-all font-medium text-sm ${
                        active 
                        ? 'bg-brand-card text-brand-primary shadow-sm' 
                        : 'text-brand-muted hover:bg-black/5 dark:hover:bg-white/5'
                    }`}
                >
                    <span className={active ? '' : 'opacity-80'}>{icon}</span>
                    <span className="hidden md:inline">{label}</span>
                </button>
            );
        }

        // --- Views ---

        function HomeView({ calc, formatMoney, bills, categories, transactions, onDeleteTx }) {
            // Chart Data Prep
            const categoryData = categories.map(cat => {
                const spent = transactions
                    .filter(t => t.type === 'expense' && t.categoryId === cat.id)
                    .reduce((sum, t) => sum + parseFloat(t.amount), 0);
                return { name: cat.name, spent, budget: cat.budget };
            });

            return (
                <div className="fade-in space-y-8">
                    <header>
                        <h2 className="text-3xl font-bold tracking-tight">Home</h2>
                        <p className="text-brand-muted mt-1">Your entire financial picture, simplified.</p>
                    </header>

                    {/* Core Stats */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="bg-brand-card p-6 rounded-[2rem] shadow-soft border border-black/5 dark:border-white/5">
                            <h3 className="text-sm font-semibold text-brand-muted">Total Income Logged</h3>
                            <p className="text-3xl font-bold mt-2 text-brand-sage">{formatMoney(calc.totalIncome)}</p>
                        </div>
                        <div className="bg-brand-card p-6 rounded-[2rem] shadow-soft border border-black/5 dark:border-white/5">
                            <h3 className="text-sm font-semibold text-brand-muted">Total Money Out</h3>
                            <p className="text-3xl font-bold mt-2">{formatMoney(calc.totalExpense)}</p>
                            <p className="text-xs text-brand-muted mt-1">(Expenses + Savings + Debt)</p>
                        </div>
                        <div className="bg-brand-primary/10 p-6 rounded-[2rem] shadow-soft border border-brand-primary/20">
                            <h3 className="text-sm font-semibold text-brand-primary">Safe to spend right now</h3>
                            <p className={`text-4xl font-bold mt-2 ${calc.safeToSpend < 0 ? 'text-brand-danger' : 'text-brand-text'}`}>{formatMoney(calc.safeToSpend)}</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 mt-8">
                        {/* Upcoming Bills */}
                        <div>
                            <h3 className="text-xl font-bold mb-4">Upcoming Bills</h3>
                            <div className="space-y-3">
                                {bills.slice(0, 4).map(bill => (
                                    <div key={bill.id} className="flex justify-between items-center bg-brand-card p-4 rounded-2xl shadow-soft">
                                        <div className="flex items-center gap-3">
                                            <div className="w-10 h-10 rounded-full bg-brand-bg flex items-center justify-center text-sm font-bold text-brand-muted">
                                                {bill.date}
                                            </div>
                                            <span className="font-semibold">{bill.name}</span>
                                        </div>
                                        <span className="font-bold">{formatMoney(bill.amount)}</span>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Visual Chart */}
                        <div>
                            <h3 className="text-xl font-bold mb-4">Top Spending Categories</h3>
                            <div className="bg-brand-card p-6 rounded-[2rem] shadow-soft h-64 flex items-end gap-2 justify-around overflow-hidden border border-black/5 dark:border-white/5">
                                {categoryData.sort((a,b)=> b.spent - a.spent).slice(0, 6).map((cat, i) => {
                                    const maxVal = Math.max(...categoryData.map(c => Math.max(c.budget, c.spent))) || 1;
                                    const plannedHeight = (cat.budget / maxVal) * 100;
                                    const actualHeight = (cat.spent / maxVal) * 100;
                                    return (
                                        <div key={i} className="flex flex-col items-center gap-2 group h-full justify-end w-1/6">
                                            <div className="relative w-full flex justify-center items-end gap-1 h-3/4">
                                                <div className="w-1/3 bg-brand-bg rounded-t-sm" style={{height: `${plannedHeight}%`}}></div>
                                                <div className={`w-1/3 rounded-t-sm ${cat.spent > cat.budget ? 'bg-brand-danger' : 'bg-brand-primary'}`} style={{height: `${actualHeight}%`}}></div>
                                            </div>
                                            <span className="text-[10px] font-medium text-brand-muted text-center leading-tight h-8 overflow-hidden">{cat.name}</span>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>

                    {/* Recent Transactions List */}
                    <div className="mt-8">
                        <h3 className="text-xl font-bold mb-4">Recent Transactions</h3>
                        <div className="space-y-3">
                            {transactions.slice(0, 5).map(t => (
                                <div key={t.id} className="flex justify-between items-center bg-brand-card p-4 rounded-2xl shadow-soft">
                                    <div>
                                        <p className="font-bold">{t.categoryName} <span className="text-xs font-normal text-brand-muted px-2 py-1 bg-brand-bg rounded-md ml-2 uppercase tracking-wide">{t.type}</span></p>
                                        <p className="text-sm text-brand-muted mt-1">{new Date(t.date).toLocaleDateString()} {t.note && `• ${t.note}`}</p>
                                    </div>
                                    <div className="flex items-center gap-4">
                                        <span className={`font-bold ${t.type === 'income' ? 'text-brand-sage' : ''}`}>
                                            {t.type === 'income' ? '+' : '-'}{formatMoney(t.amount)}
                                        </span>
                                        <button onClick={() => onDeleteTx(t.id)} className="text-brand-muted hover:text-brand-danger transition p-2"><Icons.Trash /></button>
                                    </div>
                                </div>
                            ))}
                            {transactions.length === 0 && <p className="text-brand-muted italic">No transactions logged yet.</p>}
                        </div>
                    </div>
                </div>
            );
        }

        function TodayView({ transactions, safe, formatMoney, onDeleteTx }) {
            const todayStr = new Date().toISOString().split('T')[0];
            const todayTxs = transactions.filter(t => t.date.startsWith(todayStr));

            return (
                <div className="fade-in space-y-8">
                    <header>
                        <h2 className="text-3xl font-bold tracking-tight">Today</h2>
                    </header>
                    <div className="bg-brand-primary/10 p-10 rounded-[2rem] text-center max-w-md mx-auto border border-brand-primary/20 shadow-soft">
                        <p className="text-brand-primary font-bold uppercase tracking-widest text-sm mb-2">Available in Wallet</p>
                        <h1 className="text-5xl font-bold tracking-tight">{formatMoney(safe)}</h1>
                    </div>
                    <div>
                        <h3 className="text-xl font-bold mb-4">Today's Log</h3>
                        <div className="space-y-3">
                            {todayTxs.map(t => (
                                <div key={t.id} className="flex justify-between items-center bg-brand-card p-4 rounded-2xl shadow-soft border border-black/5">
                                    <div>
                                        <p className="font-bold">{t.categoryName}</p>
                                        <p className="text-sm text-brand-muted">{t.note}</p>
                                    </div>
                                    <div className="flex items-center gap-4">
                                        <span className="font-bold">{t.type === 'income' ? '+' : '-'}{formatMoney(t.amount)}</span>
                                        <button onClick={() => onDeleteTx(t.id)} className="text-brand-muted hover:text-brand-danger"><Icons.Trash /></button>
                                    </div>
                                </div>
                            ))}
                            {todayTxs.length === 0 && <div className="text-center p-8 bg-brand-card rounded-3xl border border-dashed border-brand-muted/30"><p className="text-brand-muted">Nothing logged today.</p></div>}
                        </div>
                    </div>
                </div>
            );
        }

        function CalendarView({ bills, setBills, formatMoney, transactions }) {
            const today = new Date();
            const daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
            const days = Array.from({length: daysInMonth}, (_, i) => i + 1);
            
            return (
                <div className="fade-in space-y-8">
                    <header>
                        <h2 className="text-3xl font-bold tracking-tight">Calendar</h2>
                        <p className="text-brand-muted mt-1">Hover over a date to see daily cash flow.</p>
                    </header>
                    <div className="bg-brand-card p-6 md:p-8 rounded-[2rem] shadow-soft">
                        <div className="grid grid-cols-7 gap-2 md:gap-4 text-center mb-4 text-sm font-semibold text-brand-muted">
                            <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
                        </div>
                        <div className="grid grid-cols-7 gap-2 md:gap-4">
                            {days.map(day => {
                                const hasBill = bills.find(b => parseInt(b.date) === day);
                                const dateStr = new Date(today.getFullYear(), today.getMonth(), day).toISOString().split('T')[0];
                                const dayTxs = transactions.filter(t => t.date.startsWith(dateStr));
                                
                                const inc = dayTxs.filter(t => t.type === 'income').reduce((s,t) => s + parseFloat(t.amount), 0);
                                const exp = dayTxs.filter(t => t.type !== 'income').reduce((s,t) => s + parseFloat(t.amount), 0);

                                return (
                                    <div key={day} className="group aspect-square bg-brand-bg rounded-xl p-2 relative flex flex-col items-start justify-start hover:border-brand-primary border border-transparent transition cursor-pointer">
                                        <span className="text-sm font-bold text-brand-muted">{day}</span>
                                        {hasBill && <div className={`w-2 h-2 rounded-full mt-auto ${hasBill.paid ? 'bg-brand-sage' : 'bg-brand-danger'}`}></div>}
                                        
                                        {/* Tooltip */}
                                        <div className="hidden group-hover:block absolute z-50 bottom-full left-1/2 transform -translate-x-1/2 mb-2 w-48 bg-brand-card rounded-2xl shadow-[0_10px_40px_rgba(0,0,0,0.15)] border border-black/5 p-4 pointer-events-none">
                                            <div className="text-xs font-bold text-brand-muted mb-3 pb-2 border-b border-black/5">Day {day} Summary</div>
                                            <div className="flex justify-between items-center text-sm mb-2">
                                                <span className="text-brand-muted font-medium">In</span>
                                                <span className="font-bold text-brand-sage">+{formatMoney(inc)}</span>
                                            </div>
                                            <div className="flex justify-between items-center text-sm">
                                                <span className="text-brand-muted font-medium">Out</span>
                                                <span className="font-bold text-brand-danger">-{formatMoney(exp)}</span>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        // Reusable generic progress view for Savings, Goals, and Debt
        function ProgressView({ title, type, data, setData, transactions, formatMoney, color }) {
            const [newName, setNewName] = useState('');
            const [newTarget, setNewTarget] = useState('');

            const handleAdd = (e) => {
                e.preventDefault();
                if(newName && newTarget) {
                    setData([...data, { id: Date.now().toString(), name: newName, target: parseFloat(newTarget) }]);
                    setNewName(''); setNewTarget('');
                }
            };

            return (
                <div className="fade-in space-y-8">
                    <header>
                        <h2 className="text-3xl font-bold tracking-tight">{title}</h2>
                    </header>

                    {/* Add Form */}
                    <div className="bg-brand-card p-6 rounded-[2rem] shadow-soft">
                        <form onSubmit={handleAdd} className="flex flex-col md:flex-row gap-4">
                            <input type="text" placeholder={`New ${title} Name`} value={newName} onChange={e => setNewName(e.target.value)} className="flex-1 p-4 rounded-xl bg-brand-bg border-none focus:ring-2 focus:ring-brand-primary outline-none font-medium" required />
                            <input type="number" placeholder="Target Amount" value={newTarget} onChange={e => setNewTarget(e.target.value)} className="w-full md:w-48 p-4 rounded-xl bg-brand-bg border-none focus:ring-2 focus:ring-brand-primary outline-none font-medium" required />
                            <button type="submit" className="px-8 py-4 bg-brand-primary text-white font-bold rounded-xl shadow-soft">Add</button>
                        </form>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {data.map(item => {
                            // Calculate current progress dynamically from transactions
                            const current = transactions
                                .filter(t => t.type === type && t.categoryId === item.id)
                                .reduce((sum, t) => sum + parseFloat(t.amount), 0);
                            
                            const percent = Math.min((current / item.target) * 100, 100);
                            
                            return (
                                <div key={item.id} className="bg-brand-card p-6 md:p-8 rounded-[2rem] shadow-soft group relative">
                                    <button onClick={() => setData(data.filter(d=>d.id !== item.id))} className="absolute top-6 right-6 text-brand-muted hover:text-brand-danger opacity-0 group-hover:opacity-100 transition"><Icons.Trash /></button>
                                    <div className="flex justify-between items-end mb-4 pr-8">
                                        <h3 className="text-xl font-bold">{item.name}</h3>
                                        <span className="text-2xl font-bold">{Math.round(percent)}%</span>
                                    </div>
                                    <div className="h-4 w-full bg-brand-bg rounded-full overflow-hidden mb-4 shadow-inner-soft">
                                        <div className={`h-full progress-bar rounded-full ${color}`} style={{ width: `${percent}%` }}></div>
                                    </div>
                                    <div className="flex justify-between text-sm font-semibold text-brand-muted">
                                        <span>{formatMoney(current)} logged</span>
                                        <span>Target: {formatMoney(item.target)}</span>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        function EnvelopesView({ envelopes, setEnvelopes, transactions, formatMoney }) {
            const [newName, setNewName] = useState('');
            const [newBudget, setNewBudget] = useState('');

            const handleAdd = (e) => {
                e.preventDefault();
                if(newName && newBudget) {
                    setEnvelopes([...envelopes, { id: Date.now().toString(), name: newName, budget: parseFloat(newBudget) }]);
                    setNewName(''); setNewBudget('');
                }
            };

            return (
                <div className="fade-in space-y-8">
                    <header>
                        <h2 className="text-3xl font-bold tracking-tight">Cash Envelopes</h2>
                        <p className="text-brand-muted mt-1">Give every dollar a job.</p>
                    </header>

                    <div className="bg-brand-card p-6 rounded-[2rem] shadow-soft">
                        <form onSubmit={handleAdd} className="flex flex-col md:flex-row gap-4">
                            <input type="text" placeholder="Envelope Category Name" value={newName} onChange={e => setNewName(e.target.value)} className="flex-1 p-4 rounded-xl bg-brand-bg border-none focus:ring-2 focus:ring-brand-primary outline-none font-medium" required />
                            <input type="number" placeholder="Monthly Budget" value={newBudget} onChange={e => setNewBudget(e.target.value)} className="w-full md:w-48 p-4 rounded-xl bg-brand-bg border-none focus:ring-2 focus:ring-brand-primary outline-none font-medium" required />
                            <button type="submit" className="px-8 py-4 bg-brand-primary text-white font-bold rounded-xl shadow-soft">Create Envelope</button>
                        </form>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {envelopes.map(cat => {
                            const spent = transactions
                                .filter(t => t.type === 'expense' && t.categoryId === cat.id)
                                .reduce((sum, t) => sum + parseFloat(t.amount), 0);
                            const remaining = cat.budget - spent;
                            const percent = Math.min((spent / cat.budget) * 100, 100);
                            
                            return (
                                <div key={cat.id} className="bg-brand-card p-6 rounded-[2rem] shadow-soft flex flex-col relative group">
                                    <button onClick={() => setEnvelopes(envelopes.filter(e=>e.id !== cat.id))} className="absolute top-6 right-6 text-brand-muted hover:text-brand-danger opacity-0 group-hover:opacity-100 transition"><Icons.Trash /></button>
                                    <h3 className="text-lg font-bold mb-1 pr-6">{cat.name}</h3>
                                    <p className="text-sm font-medium text-brand-muted mb-4">Budget: {formatMoney(cat.budget)}</p>
                                    
                                    <div className="h-3 w-full bg-brand-bg rounded-full overflow-hidden mb-4 mt-auto shadow-inner-soft">
                                        <div className={`h-full progress-bar rounded-full ${remaining < 0 ? 'bg-[#E07A5F]' : 'bg-brand-primary'}`} style={{ width: `${percent}%` }}></div>
                                    </div>
                                    
                                    <div className="flex justify-between text-sm font-bold">
                                        <span className="text-brand-muted">{formatMoney(spent)} spent</span>
                                        <span className={remaining < 0 ? 'text-[#E07A5F]' : 'text-[#86A789]'}>{formatMoney(remaining)} left</span>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        // --- Core Action Modal ---
        function TrackModal({ onClose, onSave, envelopes, savings, goals, debts }) {
            const [type, setType] = useState('expense'); // expense, income, savings, goal, debt
            const [amount, setAmount] = useState('');
            const [categoryId, setCategoryId] = useState('');
            const [note, setNote] = useState('');
            const [dateStr, setDateStr] = useState(new Date().toISOString().split('T')[0]);

            // Dynamically get the list of options based on type
            const getOptions = () => {
                if (type === 'expense') return envelopes;
                if (type === 'savings') return savings;
                if (type === 'goal') return goals;
                if (type === 'debt') return debts;
                return [{ id: 'income', name: 'General Income' }];
            };

            const options = getOptions();

            // Auto-select first option when type changes
            useEffect(() => {
                if (options.length > 0) setCategoryId(options[0].id);
            }, [type]);

            const handleSave = () => {
                if(!amount || !categoryId) return;
                const catName = options.find(o => o.id === categoryId)?.name || 'Income';
                
                onSave({
                    type,
                    amount: parseFloat(amount).toFixed(2),
                    categoryId,
                    categoryName: catName,
                    note,
                    date: new Date(dateStr).toISOString()
                });
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 backdrop-blur-md bg-black/40 fade-in">
                    <div className="bg-brand-card w-full max-w-lg rounded-[2rem] shadow-2xl overflow-hidden slide-up border border-black/5 dark:border-white/10">
                        <div className="p-6 border-b border-black/5 dark:border-white/5 flex justify-between items-center bg-brand-sidebar">
                            <h2 className="text-2xl font-bold">Log Transaction</h2>
                            <button onClick={onClose} className="p-2 bg-brand-card rounded-full text-brand-muted hover:text-brand-text transition shadow-sm"><Icons.X /></button>
                        </div>
                        
                        <div className="p-6 md:p-8 space-y-6">
                            {/* Type Selector */}
                            <div className="flex flex-wrap gap-2 p-1 bg-brand-bg rounded-xl">
                                {['expense', 'income', 'savings', 'goal', 'debt'].map(t => (
                                    <button 
                                        key={t}
                                        onClick={() => setType(t)} 
                                        className={`flex-1 min-w-[80px] py-2 rounded-lg text-xs font-bold uppercase tracking-wider transition ${type === t ? 'bg-brand-card shadow-sm text-brand-text' : 'text-brand-muted hover:bg-black/5'}`}
                                    >
                                        {t}
                                    </button>
                                ))}
                            </div>
                            
                            <div className="space-y-4">
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-bold text-brand-muted mb-2 uppercase tracking-wide">Amount</label>
                                        <input type="number" step="0.01" value={amount} onChange={e => setAmount(e.target.value)} placeholder="0.00" className="w-full p-4 rounded-xl bg-brand-bg border-none focus:ring-2 focus:ring-brand-primary outline-none font-bold text-xl" autoFocus />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-brand-muted mb-2 uppercase tracking-wide">Date</label>
                                        <input type="date" value={dateStr} onChange={e => setDateStr(e.target.value)} className="w-full p-4 rounded-xl bg-brand-bg border-none focus:ring-2 focus:ring-brand-primary outline-none font-medium" />
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-brand-muted mb-2 uppercase tracking-wide">Assign To</label>
                                    <select value={categoryId} onChange={e => setCategoryId(e.target.value)} className="w-full p-4 rounded-xl bg-brand-bg border-none focus:ring-2 focus:ring-brand-primary outline-none font-medium appearance-none">
                                        {options.map(opt => <option key={opt.id} value={opt.id}>{opt.name}</option>)}
                                    </select>
                                </div>
                                
                                <div>
                                    <label className="block text-xs font-bold text-brand-muted mb-2 uppercase tracking-wide">Note (optional)</label>
                                    <input type="text" value={note} onChange={e => setNote(e.target.value)} placeholder="What was this for?" className="w-full p-4 rounded-xl bg-brand-bg border-none focus:ring-2 focus:ring-brand-primary outline-none font-medium" />
                                </div>
                            </div>
                            
                            <button onClick={handleSave} className="w-full py-4 mt-4 bg-brand-primary hover:bg-brand-primaryHover text-white font-bold text-lg rounded-xl shadow-soft transition">Save Transaction</button>
                        </div>
                    </div>
                </div>
            );
        }

        // --- Pro Settings View ---
        function SettingsView({ settings, setSettings }) {
            
            // Backup functionality removed for DEMO version

            return (
                <div className="fade-in space-y-8 max-w-2xl">
                    <header>
                        <h2 className="text-3xl font-bold tracking-tight">Pro Settings</h2>
                        <p className="text-brand-muted mt-1">Customize your planner.</p>
                    </header>

                    {/* Preferences */}
                    <div className="bg-brand-card p-6 md:p-8 rounded-[2rem] shadow-soft space-y-6">
                        <div className="flex items-center justify-between pb-6 border-b border-black/5 dark:border-white/5">
                            <div>
                                <h3 className="text-lg font-bold">Dark Mode</h3>
                                <p className="text-sm text-brand-muted">Easy on the eyes.</p>
                            </div>
                            <button onClick={() => setSettings({...settings, darkMode: !settings.darkMode})} className="p-3 bg-brand-bg rounded-xl hover:scale-105 transition">
                                {settings.darkMode ? <Icons.Sun /> : <Icons.Moon />}
                            </button>
                        </div>
                        
                        <div className="flex items-center justify-between pb-6 border-b border-black/5 dark:border-white/5">
                            <div>
                                <h3 className="text-lg font-bold">Currency</h3>
                                <p className="text-sm text-brand-muted">Global symbol setting.</p>
                            </div>
                            <select 
                                value={settings.currencySymbol} 
                                onChange={e => setSettings({...settings, currencySymbol: e.target.value})}
                                className="p-3 bg-brand-bg rounded-xl border-none outline-none font-bold"
                            >
                                <option value="$">$ (USD/CAD/AUD)</option>
                                <option value="£">£ (GBP)</option>
                                <option value="€">€ (EUR)</option>
                                <option value="Rs ">Rs (INR/PKR)</option>
                                <option value="¥">¥ (JPY/CNY)</option>
                            </select>
                        </div>

                        <div>
                            <h3 className="text-lg font-bold mb-4">Theme Color</h3>
                            <div className="flex gap-4">
                                {['pink', 'sage', 'slate', 'lavender'].map(color => (
                                    <button 
                                        key={color} 
                                        onClick={() => setSettings({...settings, themeColor: color})}
                                        className={`w-12 h-12 rounded-full flex items-center justify-center transition ${settings.themeColor === color ? 'ring-4 ring-offset-2 ring-brand-text dark:ring-offset-brand-darkBg' : 'hover:scale-110'}`}
                                        style={{
                                            backgroundColor: color === 'pink' ? '#E09891' : color === 'sage' ? '#86A789' : color === 'slate' ? '#64748B' : '#9F86C0'
                                        }}
                                    >
                                        {settings.themeColor === color && <span className="text-white"><Icons.Check /></span>}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
